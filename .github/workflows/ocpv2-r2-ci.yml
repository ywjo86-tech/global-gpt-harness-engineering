name: OCPv2 R2 CI

on:
  push:
    branches:
      - impl/operator-control-plane-v2-r2
  pull_request:
    paths:
      - "runtime/orchestrator/**"
      - "runtime/operator_transport/**"
      - "deploy/operator-control-plane-v2/**"
      - "tests/**"
      - ".github/workflows/ocpv2-r2-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest -v tests.test_operator_control
      - run: python3 -m unittest -v tests.test_durable_continuation_locking
      - run: python3 -m unittest -v tests.test_runtime_migration_handoff
      - run: python3 -m unittest -v tests.test_production_execution_gateway
      - run: python3 -m unittest -v tests.test_production_tool_transport
      - run: python3 -m compileall -q runtime tests
      - run: git diff --check
